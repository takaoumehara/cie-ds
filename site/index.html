<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cie-ds — Design System Docs</title>
    <meta name="description" content="Personal/internal design system for Creativity Is Everywhere. Copy one prompt into your AI to use it." />
    <meta name="robots" content="noindex" />
    <script>
      try { var t = localStorage.getItem("cie-registry-theme"); if (t === "light") document.documentElement.classList.remove("dark") } catch (e) {}
      // UI language: saved choice → browser language → ja (shared with classic.html and /registry)
      try {
        var l = localStorage.getItem("cie-ui-lang") || ((navigator.language || "ja").slice(0, 2) === "ja" ? "ja" : "en");
        document.documentElement.setAttribute("data-ui", l);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Outfit:wght@100..900&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
